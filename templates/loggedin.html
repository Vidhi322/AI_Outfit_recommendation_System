{% extends "logintemplate.html" %}
{% block navbar %}
<nav class="main-nav">
    <a href="/">Home</a>
    <a href="/userprofile">Wardrobe</a>
    <a href="/logout" class="nav-cta">Sign Out</a>
</nav>
{% endblock %}
{% block content %}
<div style="max-width:620px;margin:5rem auto;text-align:center;">
    <div style="width:64px;height:64px;background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.25);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 2rem;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c9a96e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <h1 class="page-title">Hello, <em>{{ pred }}</em></h1>
    <p class="page-subtitle">You're signed in. What would you like to do today?</p>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:2.5rem;max-width:440px;margin-left:auto;margin-right:auto;">
        <a href="/fashion" class="card" style="text-decoration:none;text-align:left;display:block;padding:1.5rem;transition:border-color 0.2s;">
            <div style="margin-bottom:1rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a96e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <p style="font-size:0.95rem;font-weight:500;color:var(--text-primary);margin-bottom:0.25rem;">Upload to Wardrobe</p>
            <p style="font-size:0.78rem;color:var(--text-secondary);">Add new clothing items</p>
        </a>
        <a href="/select" class="card" style="text-decoration:none;text-align:left;display:block;padding:1.5rem;transition:border-color 0.2s;">
            <div style="margin-bottom:1rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a96e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
            </div>
            <p style="font-size:0.95rem;font-weight:500;color:var(--text-primary);margin-bottom:0.25rem;">Outfit Recommender</p>
            <p style="font-size:0.78rem;color:var(--text-secondary);">Get styled for any occasion</p>
        </a>
    </div>
</div>
{% endblock %}
