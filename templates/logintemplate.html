<!DOCTYPE html>
<html>
<head>
    <title>Vogue AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SAME FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0f0e0d;
            --surface: #181614;
            --surface2: #221f1c;
            --border: #2e2a26;
            --border-light: #3a3530;
            --accent: #c9a96e;
            --text-primary: #f0ece6;
            --text-secondary: #9a9088;
            --text-muted: #5a5248;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            line-height: 1.6;
        }

        /* NAV */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 14, 13, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .site-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 0.25rem;
        }

        nav a {
            padding: 0.45rem 1rem;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: var(--text-primary);
            background: var(--surface2);
        }

        .nav-cta {
            background: var(--accent);
            color: var(--bg);
            font-weight: 500;
        }

        /* HERO (MATCH INDEX PERFECTLY) */
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 6rem 2rem 4rem;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(
                ellipse 60% 50% at 50% 40%,
                rgba(201,169,110,0.08) 0%,
                transparent 70%
            );
        }

        .hero-tag {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            border: 1px solid rgba(201,169,110,0.3);
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            margin-bottom: 2rem;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 7vw, 5rem);
            font-weight: 300;
            line-height: 1.1;
            letter-spacing: -0.01em;
            margin-bottom: 1.5rem;
        }

        .hero-title em {
            color: var(--accent);
            font-style: italic;
        }

        .hero-desc {
            max-width: 560px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        /* CARD */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
        }

        /* FORM */
        .form-group {
            margin-bottom: 1.3rem;
            text-align: left;
        }

        .form-label {
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            display: block;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-primary);
            transition: border 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
            outline: none;
        }

        /* BUTTON */
        .btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--accent);
            color: var(--bg);
            border: none;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #d4b580;
        }

        .divider {
            border-top: 1px solid var(--border);
            margin: 1.8rem 0;
        }

        .site-footer {
            border-top: 1px solid var(--border);
            padding: 1.5rem 2.5rem;
            display: flex;
            justify-content: space-between;
        }

        .site-footer p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .upload-box {
    border: 1px dashed var(--border);
    padding: 2rem;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    background: var(--surface);
    transition: all 0.3s ease;
    position: relative;
}

.upload-box:hover {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(201,169,110,0.15);
}

.upload-box input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
}

.upload-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
}

.upload-sub {
    font-size: 0.8rem;
    color: var(--text-secondary);
}

.preview-wrapper {
    margin: 2rem 0;
    display: flex;
    justify-content: center;
}

.preview-wrapper img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--border);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.preview-wrapper img:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.loading {
    text-align: center;
    margin-top: 2rem;
}

.hidden {
    display: none;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
    </style>
</head>

<body>

<header class="site-header">
    <a href="/" class="site-logo">Vogue AI</a>
    {% block navbar %}{% endblock %}
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <p>© 2026 Vogue AI</p>
    <p>Powered by Deep Learning</p>
</footer>

</body>
</html>
