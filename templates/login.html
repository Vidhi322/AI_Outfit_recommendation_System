{% extends "logintemplate.html" %}
{%block navbar %}
<nav class="main-nav">
    <a href="/">Home</a>
    <a href="/login">Sign In</a>
    <a href="/signup" class="nav-cta">Get Started</a>
</nav>
{% endblock %}
{% block content %}
<div style="max-width:420px;margin:4rem auto;">
    <div style="text-align:center;margin-bottom:2.5rem;">
        <h1 class="hero-title">
    Welcome <em>Back</em>
</h1>

<p class="hero-desc">
    Sign in to access your wardrobe
</p>
    </div>
    <div class="card">
        <form action="/loginresult" method="POST">
            <div class="form-group">
                <label class="form-label" for="uname">Username</label>
                <input class="form-input" type="text" id="uname" name="uname" placeholder="Enter your username" autocomplete="username">
            </div>
            <div class="form-group" style="margin-bottom:0.5rem;">
                <label class="form-label" for="pwd">Password</label>
                <input class="form-input" type="password" id="pwd" name="pwd" placeholder="Enter your password" autocomplete="current-password">
            </div>
            {% if pred %}
            <div class="alert alert-error" style="margin-top:1rem;">{{ pred }}</div>
            {% endif %}
            <div style="margin-top:1.75rem;">
                <input class="btn btn-primary" style="width:100%;justify-content:center;" type="submit" value="Sign In">
            </div>
        </form>
        <div class="divider"></div>
        <p style="text-align:center;font-size:0.82rem;color:var(--text-secondary);">
            Don't have an account? <a href="/signup" style="color:var(--accent);text-decoration:none;">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
